    />

    <!-- 2. BLUE PETAL (Bottom Left Slanted Rhombus) -->
    <path 
      d="M 44 83 
         C 46 77, 51 73, 59 73 
         L 96 73 
         C 101 73, 105 76, 103 81 
         L 67 132 
         C 64 136, 59 139, 53 139 
         L 13 139 
         C 8 139, 5 136, 6 131 
         C 7 127, 10 122, 14 116 
         Z" 
