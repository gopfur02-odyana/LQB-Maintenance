         C 137 8, 140 10, 142 14 
         C 144 18, 143 23, 138 29 
         L 100 78 
         C 97 82, 92 85, 87 85 
         L 44 85 
         C 40 85, 37 83, 36 79 
         C 35 76, 36 71, 40 65 
